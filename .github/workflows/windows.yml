name: Windows build and tests
on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build C17 application, installer and integration tests
        shell: cmd
        run: build.cmd test
      - name: Analyze native C sources
        shell: cmd
        run: build.cmd analyze
      - name: Check clipboard paste warnings and text interchange
        shell: cmd
        run: build\tests.exe --clipboard-only
      - name: Test installation and preserve notes on uninstall
        shell: pwsh
        run: ./tools/test-install.ps1
      - name: Package portable download and checksums
        shell: pwsh
        run: ./tools/package.ps1
      - name: Save downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jotilla-windows-x64
          path: |
            dist/Jotilla.exe
            dist/Jotilla-Setup-x64.exe
            dist/Jotilla-portable-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
