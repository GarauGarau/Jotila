name: macOS build and tests
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native application and run storage tests
        run: make all test
      - name: Test native UI and application launch
        run: make ui-test smoke-test
      - name: Analyze Objective-C sources
        run: make analyze
      - name: Save native UI snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jotilla-macos-ui-${{ matrix.runner }}
          path: build/macos/ui-snapshots/*
          if-no-files-found: warn
      - name: Build universal installer and portable download
        if: matrix.runner == 'macos-15'
        run: make package
      - name: Save universal downloads
        if: matrix.runner == 'macos-15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jotilla-macos-universal
          path: dist/macos/*
          if-no-files-found: error
